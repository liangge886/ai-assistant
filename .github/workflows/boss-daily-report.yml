name: 觉爱家纺·老板每日经营分析报表

on:
  # 定时触发改由 cron-job.org 负责（每天 21:40 北京时间，可靠准点）
  # GitHub 自带 schedule 不准时（常延迟约3小时），已弃用
  workflow_dispatch:
    inputs:
      task:
        description: '执行任务（默认 boss_report）'
        required: false
        default: 'boss_report'

jobs:
  boss-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Shanghai
      FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
      FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
    permissions:
      contents: write   # 允许脚本把缓存数据 git push 回仓库
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true   # 保留 GITHUB_TOKEN 供 git push

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests

      - name: 配置 git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 生成并发送老板每日经营分析报表
        run: python3 boss_daily_report.py
